<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Healthwatch Demo</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --panel: #ffffff;
        --primary: #1f5fa6;
        --primary-dark: #143f73;
        --text: #1f2b3d;
        --muted: #5d6b82;
        --border: #dfe7f3;
        --success: #2a8b5c;
        --error: #b42318;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 980px;
        margin: 32px auto;
        padding: 0 16px;
      }

      .hero {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        padding: 24px 28px;
        border-radius: 16px;
        box-shadow: 0 10px 25px rgba(25, 65, 120, 0.15);
      }

      .hero h1 {
        margin: 0 0 8px;
        font-size: 2rem;
      }

      .hero p {
        margin: 0;
        opacity: 0.95;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.05fr 1.2fr;
        gap: 24px;
        margin-top: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 8px 20px rgba(26, 49, 80, 0.04);
      }

      .panel h2 {
        margin-top: 0;
        margin-bottom: 16px;
        font-size: 1.3rem;
      }

      .patient-card {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 18px;
      }

      .stat-box {
        background: #f7faff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }

      .stat-box strong {
        display: block;
        font-size: 1.5rem;
        margin-bottom: 6px;
      }

      .field {
        margin-bottom: 18px;
      }

      .field label {
        display: block;
        margin-bottom: 8px;
        font-weight: 700;
      }

      .field textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        font: inherit;
        resize: vertical;
      }

      .checklist {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }

      .checkbox-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 10px 12px;
        background: #f9fbfe;
      }

      .checkbox-item input {
        width: 18px;
        height: 18px;
      }

      button {
        background: var(--primary);
        color: white;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: var(--primary-dark);
      }

      .status {
        margin-top: 14px;
        min-height: 24px;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .status.error { color: var(--error); }
      .status.success { color: var(--success); }

      .history-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      .history-item {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 14px;
        margin-bottom: 12px;
        background: #fbfdff;
      }

      .history-item h3 {
        margin: 0 0 8px;
        font-size: 1rem;
      }

      .meta {
        font-size: 0.83rem;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .report-notes {
        margin: 12px 0 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .pill-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .pill {
        display: inline-block;
        background: #eaf3ff;
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 6px 10px;
        font-size: 0.85rem;
        border: 1px solid #dfeaff;
      }

      @media (max-width: 760px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="hero">
        <h1>Healthwatch Demo</h1>
        <p>Patient symptom logging for a synthetic demo patient.</p>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>Patient profile</h2>
          <div id="patient-card" class="patient-card"></div>

          <h2>Submit a symptom report</h2>
          <form id="symptom-form">
            <div class="field">
              <label for="patient-id">Patient</label>
              <div id="patient-id">11111111-1111-2111-6111-111111111111</div>
            </div>

            <div class="field">
              <label>Select symptoms</label>
              <div id="symptom-list" class="checklist"></div>
            </div>

            <div class="field">
              <label for="report-notes">Additional details (optional)</label>
              <textarea
                id="report-notes"
                name="notes"
                rows="4"
                maxlength="1000"
                placeholder="Add any details about your symptoms (up to 1,000 characters)."
              ></textarea>
            </div>

            <button type="submit">Submit report</button>
            <button type="button" id="clear-database" style="margin-left: 10px; background: #b42318;">Clear database</button>
            <div id="form-status" class="status" aria-live="polite"></div>
          </form>
        </section>

        <section class="panel">
          <h2>Saved symptom history</h2>
          <div id="summary-card" class="patient-card"></div>
          <button type="button" id="clear-history" style="margin-bottom: 16px; background: #b42318;">Clear saved history</button>
          <div id="report-list"></div>
        </section>
      </main>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
