name: CSC 394 TaskBoard CI/CD Pipeline

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-checks:
    name: FastAPI Security & Testing Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest flake8

      - name: Run Code Style Checks (Linting)
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m ruff check src tests
          python -m mypy src tests

      - name: Execute Automated Test Suite (Pytest)
        run: python -m pytest --maxfail=1 --disable-warnings

  frontend-checks:
    name: React Dashboard Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies Cleanly
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Verify Interface Compiles (Build Check)
        run: npm run build

  deploy-staging:
    name: Continuous Delivery Deployment Gate
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Promote Build to Staging Environment
        run: |
          echo "All Healthwatch quality checks passed successfully!"
          echo "Automatically promoting verified build to Staging..."