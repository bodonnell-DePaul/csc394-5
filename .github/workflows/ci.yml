name: CSC 394 TaskBoard CI/CD Pipeline

on: 
  push:
  pull_request: 
   branches: [main]

jobs:
  backend-checks: 
    name: FastAPI Security & Testing Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies 
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 httpx
      - name: Run Code Style Checks (Linting)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

   
      - name: Execute Automated Test Suite (Pytest)
        run: |
          pytest tests --maxfail=1 --disable-warnings


  frontend-checks:
    name:  React Dashboard Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Frontend Dependencies Cleanly
        working-directory: ./frontend
        run: npm ci

      - name: Verify Interface Compiles (Build Check)
        working-directory: ./frontend
        run: npm run build --if-present


  deploy-staging:
    name: 🚀 Continuous Delivery Deployment Gate
    needs: [backend-checks, frontend-checks]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Promote Build to Staging Environment
        run: |
          echo "All Healthwatch quality checks passed successfully!"
          echo "Automatically promoting verified build to Staging..."
    
